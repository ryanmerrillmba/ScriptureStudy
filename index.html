<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Scripture Study - Genesis 1</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
        @font-face {
            font-family: 'SBL Hebrew';
            src: local('SBL Hebrew'), local('SBL_Hbrw');
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-low": "#1a1c17",
                        "primary-container": "#7a9fcb",
                        "outline-variant": "#42474e",
                        "tertiary-fixed-dim": "#f0be75",
                        "surface-tint": "#a4caf8",
                        "on-secondary-fixed-variant": "#224a68",
                        "on-tertiary-fixed": "#291800",
                        "surface-container-high": "#292b26",
                        "on-tertiary-container": "#492e00",
                        "on-secondary-container": "#97bce0",
                        "error": "#ffb4ab",
                        "on-primary-fixed-variant": "#214970",
                        "surface-container-highest": "#343530",
                        "on-background": "#e3e3db",
                        "tertiary-fixed": "#ffddb2",
                        "on-error-container": "#ffdad6",
                        "background": "#121410",
                        "outline": "#8c9199",
                        "secondary-fixed": "#cde5ff",
                        "tertiary": "#f0be75",
                        "tertiary-container": "#c29450",
                        "inverse-primary": "#3b6189",
                        "on-primary-fixed": "#001d36",
                        "secondary": "#a5cbef",
                        "on-surface": "#e3e3db",
                        "inverse-surface": "#e3e3db",
                        "inverse-on-surface": "#2f312c",
                        "on-primary-container": "#04365c",
                        "surface-container": "#1e201b",
                        "surface-dim": "#121410",
                        "surface-container-lowest": "#0d0f0a",
                        "on-primary": "#003258",
                        "on-surface-variant": "#c2c7cf",
                        "primary-fixed": "#d1e4ff",
                        "on-secondary": "#033351",
                        "primary": "#a4caf8",
                        "surface": "#121410",
                        "secondary-fixed-dim": "#a5cbef",
                        "on-secondary-fixed": "#001d32",
                        "surface-bright": "#383a34",
                        "primary-fixed-dim": "#a4caf8",
                        "secondary-container": "#254c6b",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "surface-variant": "#343530",
                        "on-tertiary-fixed-variant": "#624000",
                        "on-tertiary": "#442b00",
                        
                        "custom-nav-bg": "#111111",
                        "custom-nav-border": "#333333",
                        "custom-active-bg": "#1f2a36",
                        "custom-header-bg": "#222222",
                        "custom-row-alt": "#1e1e1e",
                        "custom-word-bg": "#161616",
                        "custom-word-border": "#2a2a2a",
                        "custom-hebrew": "#d4c5a0",
                        "custom-strongs": "#888888",
                        "custom-gloss": "#bbbbbb",
                        "custom-verse-num": "#5a7fa0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "unit": "4px",
                        "margin-page": "24px",
                        "row-padding-y": "12px",
                        "gutter": "16px",
                        "interlinear-gap": "8px"
                    },
                    "fontFamily": {
                        "scripture-body": ["Georgia", "serif"],
                        "gloss-text": ["Georgia", "serif"],
                        "strongs-number": ["JetBrains Mono", "monospace"],
                        "ui-label-caps": ["Hanken Grotesk", "sans-serif"],
                        "ui-small": ["Hanken Grotesk", "sans-serif"],
                        "display-hebrew": ["SBL Hebrew", "sans-serif"]
                    },
                    "fontSize": {
                        "scripture-body": ["14px", { "lineHeight": "23.8px", "fontWeight": "400" }],
                        "gloss-text": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "strongs-number": ["10px", { "lineHeight": "12px", "fontWeight": "400" }],
                        "ui-label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.08em", "fontWeight": "600" }],
                        "ui-small": ["11px", { "lineHeight": "14px", "fontWeight": "400" }],
                        "display-hebrew": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            overflow: hidden;
            display: flex;
            flex-direction: row;
            height: 100vh;
            background-color: #121410;
            color: #e3e3db;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111; 
        }
        ::-webkit-scrollbar-thumb {
            background: #333; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555; 
        }

        .word-block-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            direction: rtl;
            justify-content: flex-start;
        }

        .word-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #161616;
            border: 1px solid #2a2a2a;
            padding: 4px 8px;
            border-radius: 2px;
            direction: ltr;
        }
        
        .book-item {
            font-family: Georgia, serif;
            font-size: 13px;
            padding: 6px 16px;
            cursor: pointer;
            border-left: 3px solid transparent;
            color: #888;
            transition: all 0.2s;
        }
        
        .book-item:hover {
            background-color: #222;
            color: #ccc;
        }

        .book-item.active {
            color: #7a9fcb;
            border-left: 3px solid #7a9fcb;
            background-color: #1f2a36;
        }

        .book-category {
            font-family: 'Hanken Grotesk', sans-serif;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #555;
            padding: 16px 16px 8px 16px;
            font-weight: 600;
        }

        .verse-num {
            vertical-align: super;
            font-size: 10px;
            color: #5a7fa0;
            margin-right: 4px;
            user-select: none;
        }

        .verse-row {
            display: flex;
            border-bottom: 1px solid var(--custom-nav-border, #333);
        }
        .verse-row:nth-child(even) {
            background-color: var(--custom-row-alt, #1e1e1e);
        }

        .col-kjv, .col-esv {
            flex: 1;
            padding: 12px 16px;
            font-family: Georgia, serif;
            font-size: 14px;
            line-height: 1.7;
            border-right: 1px solid var(--custom-nav-border, #333);
            min-width: 0;
        }
        .col-interlinear {
            flex: 1.4;
            padding: 12px 16px;
            min-width: 0;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: #555;
            font-family: 'Hanken Grotesk', sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body class="bg-background text-on-surface">
<!-- Sidebar -->
<aside id="sidebar" class="fixed left-0 top-0 h-full w-[180px] bg-custom-nav-bg border-r border-custom-nav-border flex flex-col py-4 overflow-y-auto z-10">
<div class="px-gutter mb-6">
<h1 class="font-ui-label-caps text-ui-label-caps font-bold text-primary">Scripture Study</h1>
<p class="font-ui-small text-ui-small text-on-surface-variant mt-1">Digital Scriptorium</p>
</div>
<nav id="book-list" class="flex-1">
<div class="empty-state text-[#555]">Loading...</div>
</nav>
</aside>

<!-- Main Content Area -->
<main class="flex-1 flex flex-col ml-[180px] h-full w-[calc(100%-180px)] relative">

<!-- Top Nav Bar -->
<header id="top-bar" class="fixed top-0 right-0 h-[48px] w-[calc(100%-180px)] bg-custom-header-bg border-b border-custom-nav-border flex justify-between items-center px-gutter z-20">
<button id="btn-prev" disabled class="w-8 h-8 border border-custom-nav-border flex items-center justify-center text-custom-strongs hover:text-primary-container hover:border-primary-container transition-colors rounded-sm mr-2">
<span class="material-symbols-outlined" style="font-size: 16px;">chevron_left</span>
</button>
<div class="flex items-center space-x-2">
  <select id="book-select" class="bg-custom-nav-bg text-primary font-ui-label-caps text-ui-label-caps border border-custom-nav-border rounded-sm py-1 px-2 focus:outline-none focus:border-primary cursor-pointer"></select>
  <select id="chapter-select" class="bg-custom-nav-bg text-primary font-ui-label-caps text-ui-label-caps border border-custom-nav-border rounded-sm py-1 px-2 focus:outline-none focus:border-primary cursor-pointer"></select>
</div>
<div class="flex items-center space-x-2">
<button id="btn-next" disabled class="w-8 h-8 border border-custom-nav-border flex items-center justify-center text-custom-strongs hover:text-primary-container hover:border-primary-container transition-colors rounded-sm ml-2">
<span class="material-symbols-outlined" style="font-size: 16px;">chevron_right</span>
</button>
</div>
</header>

<!-- Column Labels Bar -->
<div id="column-labels" class="fixed top-[48px] right-0 h-[32px] w-[calc(100%-180px)] bg-custom-header-bg border-b border-custom-nav-border grid grid-cols-[1fr_1fr_1.4fr] items-center px-gutter z-20">
<div class="font-ui-label-caps text-ui-label-caps text-on-surface-variant">KJV</div>
<div class="font-ui-label-caps text-ui-label-caps text-on-surface-variant pl-gutter border-l border-custom-nav-border h-full flex items-center">ESV</div>
<div class="font-ui-label-caps text-ui-label-caps text-on-surface pl-gutter border-l border-custom-nav-border h-full flex items-center">Hebrew Interlinear</div>
</div>

<!-- Scrollable Verse Container -->
<div id="scroll-container" class="flex-1 overflow-y-auto mt-[80px] pb-24">
<div id="verse-rows">
<div class="empty-state">Select a book to begin.</div>
</div>
</div>
</main>

<script src="app.js"></script>
</body>
</html>
